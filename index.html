<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bura O'yini Hisoblagichi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Komanda sonini tanlash ekrani -->
    <div id="teamSelection" class="screen active">
        <div class="container">
            <!-- Tugallanmagan o'yin (bo'lsa) -->
            <div id="resumeCard"></div>
            <h1>Komanda sonini tanlang</h1>
            <div class="button-group">
                <button class="team-btn" onclick="startGame(2)">2 Komanda</button>
                <button class="team-btn" onclick="startGame(3)">3 Komanda</button>
                <button class="team-btn" onclick="startGame(4)">4 Komanda</button>
                <button class="team-btn" onclick="startGame(5)">5 Komanda</button>
                <button class="team-btn" onclick="startGame(6)">6 Komanda</button>
            </div>
            <div class="home-links">
                <button class="link-btn" onclick="openStats('history')">
                    📜 Tarix <span id="historyCount" class="count-badge"></span>
                </button>
                <button class="link-btn" onclick="openStats('ranking')">🏆 Reyting</button>
            </div>
        </div>
    </div>

    <!-- Tarix va reyting ekrani -->
    <div id="statsScreen" class="screen">
        <div class="container">
            <div class="exit-container">
                <button class="exit-btn" onclick="showScreen('teamSelection')">⟸ Orqaga</button>
            </div>
            <div class="tabs" role="tablist">
                <button class="tab-btn" role="tab" data-tab="history" onclick="switchStatsTab('history')">📜 Tarix</button>
                <button class="tab-btn" role="tab" data-tab="ranking" onclick="switchStatsTab('ranking')">🏆 Reyting</button>
            </div>
            <div id="historyPanel" class="stats-panel" role="tabpanel"></div>
            <div id="rankingPanel" class="stats-panel" role="tabpanel" hidden></div>
        </div>
    </div>

    <!-- Hisoblagich ekrani -->
    <div id="scoreScreen" class="screen">
        <div class="container">
            <div class="exit-container">
                <button class="exit-btn" onclick="exitToMain()">⟸ Chiqish</button>
            </div>
            <!-- Kozir kartalari (faqat belgi, hisobga ta'sir qilmaydi) -->
            <div class="suit-bar">
                <div class="suit-cards">
                    <button class="suit-card black" data-suit="clubs" aria-label="Chillak">
                        <span class="sc-corner">A<br>♣</span><span class="sc-center">♣</span>
                    </button>
                    <button class="suit-card red" data-suit="hearts" aria-label="Chervi">
                        <span class="sc-corner">A<br>♥</span><span class="sc-center">♥</span>
                    </button>
                    <button class="suit-card black" data-suit="spades" aria-label="Pika">
                        <span class="sc-corner">A<br>♠</span><span class="sc-center">♠</span>
                    </button>
                    <button class="suit-card red" data-suit="diamonds" aria-label="G'isht">
                        <span class="sc-corner">A<br>♦</span><span class="sc-center">♦</span>
                    </button>
                </div>
                <div id="suitLabel" class="suit-label">Kozirni tanlang</div>
            </div>
            <div id="teamsContainer" class="teams-container"></div>
        </div>
    </div>

    <!-- G'olib ekrani -->
    <div id="winnerScreen" class="screen">
        <div class="container winner-container">
            <div class="exit-container">
                <button class="exit-btn" onclick="exitToMain()">⟸ Chiqish</button>
            </div>
            <div class="winner-rays" aria-hidden="true"></div>
            <div id="winnerAnimation" class="winner-animation">
                <div class="trophy" aria-hidden="true">🏆</div>
                <div class="winner-suits" aria-hidden="true">
                    <span>♣</span><span class="red">♥</span><span>♠</span><span class="red">♦</span>
                </div>
                <h1 id="winnerText" class="winner-text"></h1>
                <p class="winner-subtitle">CHEMPION!</p>
            </div>
            <div class="winner-actions">
                <button class="new-game-btn" onclick="newGame()">Yangi O'yin</button>
                <button class="rematch-btn" onclick="rematch()">🔁 Shu komandalar bilan qayta</button>
            </div>
            <div id="musicPlayer" class="music-player">
                <button id="soundBtn" class="mp-btn" onclick="toggleWinnerSound()"
                        aria-label="Ovozni o'chirish" title="Ovoz">🔊</button>
                <div class="mp-info">
                    <div class="mp-title">♪ G'olib qahramon kelmoqda</div>
                    <div class="mp-sub">Handel · See, the Conquering Hero Comes!</div>
                    <div class="mp-bar"><div id="musicProgress" class="mp-fill"></div></div>
                </div>
                <button class="mp-btn mp-replay" onclick="replayWinnerMusic()"
                        aria-label="Musiqani qayta qo'yish" title="Qayta qo'yish">↻</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
